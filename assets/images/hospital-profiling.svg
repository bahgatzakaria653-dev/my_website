<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>
    <pattern id="gridPattern" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#E2E8F0" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="450" rx="12" fill="#F8FAFC"/>
  <rect width="800" height="450" rx="12" fill="url(#gridPattern)"/>
  
  <!-- Window Header -->
  <rect x="30" y="25" width="740" height="40" rx="8" fill="#1E293B"/>
  <circle cx="55" cy="45" r="5" fill="#EF4444"/>
  <circle cx="75" cy="45" r="5" fill="#F59E0B"/>
  <circle cx="95" cy="45" r="5" fill="#10B981"/>
  <text x="400" y="50" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" fill="#94A3B8" text-anchor="middle">data_profiling_report.py — [Hospital Dataset: 1,000,000 Records x 17 Columns]</text>

  <!-- Main Card -->
  <rect x="30" y="75" width="740" height="345" rx="8" fill="url(#cardGrad)" stroke="#CBD5E1" stroke-width="1.5"/>

  <!-- Top Metrics Bar -->
  <rect x="50" y="95" width="210" height="60" rx="6" fill="#EAF3F7" stroke="#3B82A6" stroke-width="1"/>
  <text x="65" y="118" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#285E75">TOTAL RECORDS</text>
  <text x="65" y="142" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="700" fill="#1E293B">1,000,000</text>

  <rect x="280" y="95" width="210" height="60" rx="6" fill="#EAF3F7" stroke="#3B82A6" stroke-width="1"/>
  <text x="295" y="118" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#285E75">ATTRIBUTES PROFILED</text>
  <text x="295" y="142" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="700" fill="#1E293B">17 Columns</text>

  <rect x="510" y="95" width="240" height="60" rx="6" fill="#FEE2E2" stroke="#EF4444" stroke-width="1"/>
  <text x="525" y="118" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#991B1B">INITIAL ANOMALIES IDENTIFIED</text>
  <text x="525" y="142" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" fill="#B91C1C">Nulls · Duplicates · Placeholders</text>

  <!-- Profiling Table Simulation -->
  <rect x="50" y="175" width="700" height="225" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  
  <!-- Table Header -->
  <rect x="50" y="175" width="700" height="32" rx="6" fill="#F1F5F9"/>
  <text x="70" y="196" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#475569">COLUMN NAME</text>
  <text x="220" y="196" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#475569">DATA TYPE</text>
  <text x="360" y="196" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#475569">ISSUES DETECTED</text>
  <text x="580" y="196" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#475569">SEVERITY / STATUS</text>

  <!-- Table Rows -->
  <line x1="50" y1="237" x2="750" y2="237" stroke="#F1F5F9" stroke-width="1"/>
  <text x="70" y="226" font-family="'JetBrains Mono', monospace" font-size="11" fill="#1E293B">patient_id</text>
  <text x="220" y="226" font-family="'JetBrains Mono', monospace" font-size="11" fill="#64748B">object</text>
  <text x="360" y="226" font-family="-apple-system, sans-serif" font-size="11" fill="#DC2626">Invalid ID formats &amp; duplicate keys</text>
  <text x="580" y="226" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#DC2626">● High Priority</text>

  <line x1="50" y1="267" x2="750" y2="267" stroke="#F1F5F9" stroke-width="1"/>
  <text x="70" y="256" font-family="'JetBrains Mono', monospace" font-size="11" fill="#1E293B">admission_date / discharge</text>
  <text x="220" y="256" font-family="'JetBrains Mono', monospace" font-size="11" fill="#64748B">object (mixed)</text>
  <text x="360" y="256" font-family="-apple-system, sans-serif" font-size="11" fill="#DC2626">Mixed date formats &amp; chronological errors</text>
  <text x="580" y="256" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#DC2626">● High Priority</text>

  <line x1="50" y1="297" x2="750" y2="297" stroke="#F1F5F9" stroke-width="1"/>
  <text x="70" y="286" font-family="'JetBrains Mono', monospace" font-size="11" fill="#1E293B">email / phone_number</text>
  <text x="220" y="286" font-family="'JetBrains Mono', monospace" font-size="11" fill="#64748B">object</text>
  <text x="360" y="286" font-family="-apple-system, sans-serif" font-size="11" fill="#D97706">Corrupt syntax &amp; non-standard masks</text>
  <text x="580" y="286" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#D97706">● Medium Priority</text>

  <line x1="50" y1="327" x2="750" y2="327" stroke="#F1F5F9" stroke-width="1"/>
  <text x="70" y="316" font-family="'JetBrains Mono', monospace" font-size="11" fill="#1E293B">gender / department / blood</text>
  <text x="220" y="316" font-family="'JetBrains Mono', monospace" font-size="11" fill="#64748B">object</text>
  <text x="360" y="316" font-family="-apple-system, sans-serif" font-size="11" fill="#D97706">Placeholders ('UNKNOWN', '???', '-')</text>
  <text x="580" y="316" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#D97706">● Medium Priority</text>

  <line x1="50" y1="357" x2="750" y2="357" stroke="#F1F5F9" stroke-width="1"/>
  <text x="70" y="346" font-family="'JetBrains Mono', monospace" font-size="11" fill="#1E293B">age / bill_amount</text>
  <text x="220" y="346" font-family="'JetBrains Mono', monospace" font-size="11" fill="#64748B">float64 / int64</text>
  <text x="360" y="346" font-family="-apple-system, sans-serif" font-size="11" fill="#2563EB">Negative ages &amp; out-of-boundary values</text>
  <text x="580" y="346" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#2563EB">● Rule Validation</text>

  <!-- Screenshot Placeholder Notice -->
  <rect x="200" y="375" width="400" height="22" rx="4" fill="#3B82A6" fill-opacity="0.1"/>
  <text x="400" y="390" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" fill="#285E75" text-anchor="middle">Screenshot Slot 1: Replace with your Profiling Output Image</text>
</svg>
