<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="schemaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" rx="12" fill="#F8FAFC"/>

  <!-- Header -->
  <rect x="25" y="20" width="750" height="38" rx="8" fill="#1E293B"/>
  <text x="400" y="44" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#F1F5F9" text-anchor="middle">DATA WAREHOUSE STAR SCHEMA MODEL (GOLD LAYER)</text>

  <!-- Central Canvas -->
  <rect x="25" y="68" width="750" height="355" rx="8" fill="url(#schemaBg)" stroke="#CBD5E1" stroke-width="1.5"/>

  <!-- CENTRAL FACT TABLE -->
  <rect x="290" y="150" width="220" height="180" rx="6" fill="#FFFFFF" stroke="#D97706" stroke-width="2" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.06))"/>
  <rect x="290" y="150" width="220" height="32" rx="6" fill="#FEF3C7"/>
  <text x="400" y="171" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#92400E" text-anchor="middle">FACT_SALES</text>

  <text x="305" y="200" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#B45309">🔑 sale_key (PK)</text>
  <text x="305" y="220" font-family="'JetBrains Mono', monospace" font-size="10" fill="#1E293B">🔗 customer_key (FK)</text>
  <text x="305" y="240" font-family="'JetBrains Mono', monospace" font-size="10" fill="#1E293B">🔗 product_key (FK)</text>
  <text x="305" y="260" font-family="'JetBrains Mono', monospace" font-size="10" fill="#1E293B">🔗 date_key (FK)</text>
  <text x="305" y="280" font-family="'JetBrains Mono', monospace" font-size="10" fill="#64748B">📊 quantity</text>
  <text x="305" y="300" font-family="'JetBrains Mono', monospace" font-size="10" fill="#64748B">📊 total_amount</text>

  <!-- DIMENSION 1: Customer (Top Left) -->
  <rect x="50" y="90" width="180" height="130" rx="6" fill="#FFFFFF" stroke="#3B82A6" stroke-width="1.5"/>
  <rect x="50" y="90" width="180" height="28" rx="6" fill="#EAF3F7"/>
  <text x="140" y="109" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#285E75" text-anchor="middle">DIM_CUSTOMER</text>
  <text x="65" y="135" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#3B82A6">🔑 customer_key (PK)</text>
  <text x="65" y="155" font-family="'JetBrains Mono', monospace" font-size="10" fill="#64748B">source_customer_id</text>
  <text x="65" y="175" font-family="'JetBrains Mono', monospace" font-size="10" fill="#64748B">customer_name</text>
  <text x="65" y="195" font-family="'JetBrains Mono', monospace" font-size="10" fill="#64748B">country / city</text>

  <!-- DIMENSION 2: Product (Top Right) -->
  <rect x="570" y="90" width="180" height="130" rx="6" fill="#FFFFFF" stroke="#3B82A6" stroke-width="1.5"/>
  <rect x="570" y="90" width="180" height="28" rx="6" fill="#EAF3F7"/>
  <text x="660" y="109" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#285E75" text-anchor="middle">DIM_PRODUCT</text>
  <text x="585" y="135" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#3B82A6">🔑 product_key (PK)</text>
  <text x="585" y="155" font-family="'JetBrains Mono', monospace" font-size="10" fill="#64748B">source_product_id</text>
  <text x="585" y="175" font-family="'JetBrains Mono', monospace" font-size="10" fill="#64748B">product_name</text>
  <text x="585" y="195" font-family="'JetBrains Mono', monospace" font-size="10" fill="#64748B">category / unit_price</text>

  <!-- DIMENSION 3: Date (Bottom Left) -->
  <rect x="50" y="255" width="180" height="130" rx="6" fill="#FFFFFF" stroke="#3B82A6" stroke-width="1.5"/>
  <rect x="50" y="255" width="180" height="28" rx="6" fill="#EAF3F7"/>
  <text x="140" y="274" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#285E75" text-anchor="middle">DIM_DATE</text>
  <text x="65" y="300" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#3B82A6">🔑 date_key (PK)</text>
  <text x="65" y="320" font-family="'JetBrains Mono', monospace" font-size="10" fill="#64748B">full_date</text>
  <text x="65" y="340" font-family="'JetBrains Mono', monospace" font-size="10" fill="#64748B">year / quarter / month</text>
  <text x="65" y="360" font-family="'JetBrains Mono', monospace" font-size="10" fill="#64748B">day_of_week</text>

  <!-- Relationships lines -->
  <line x1="230" y1="160" x2="290" y2="210" stroke="#3B82A6" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="570" y1="160" x2="510" y2="230" stroke="#3B82A6" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="230" y1="310" x2="290" y2="260" stroke="#3B82A6" stroke-width="1.5" stroke-dasharray="3,3"/>

  <!-- Footer Notice -->
  <rect x="200" y="390" width="400" height="24" rx="4" fill="#3B82A6" fill-opacity="0.1"/>
  <text x="400" y="406" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" fill="#285E75" text-anchor="middle">Screenshot Slot 3: Replace with your Star Schema Diagram</text>
</svg>
