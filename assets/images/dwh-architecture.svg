<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bronzeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C2D12"/>
      <stop offset="100%" stop-color="#451A03"/>
    </linearGradient>
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B45309"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" rx="12" fill="#0F172A"/>

  <!-- Architecture Header -->
  <rect x="25" y="20" width="750" height="38" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="400" y="44" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#F1F5F9" text-anchor="middle">MEDALLION DATA WAREHOUSE ARCHITECTURE (BRONZE → SILVER → GOLD)</text>

  <!-- Sources Column -->
  <rect x="35" y="85" width="145" height="295" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
  <rect x="35" y="85" width="145" height="35" rx="8" fill="#0F172A"/>
  <text x="107" y="108" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#94A3B8" text-anchor="middle">DATA SOURCES</text>

  <!-- Source Cards -->
  <rect x="47" y="135" width="121" height="55" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
  <text x="107" y="160" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#F1F5F9" text-anchor="middle">CRM Systems</text>
  <text x="107" y="176" font-family="-apple-system, sans-serif" font-size="9" fill="#94A3B8" text-anchor="middle">Customer Data CSVs</text>

  <rect x="47" y="205" width="121" height="55" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
  <text x="107" y="230" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#F1F5F9" text-anchor="middle">ERP Systems</text>
  <text x="107" y="246" font-family="-apple-system, sans-serif" font-size="9" fill="#94A3B8" text-anchor="middle">Product &amp; Sales CSVs</text>

  <rect x="47" y="275" width="121" height="55" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
  <text x="107" y="300" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#F1F5F9" text-anchor="middle">Transactions</text>
  <text x="107" y="316" font-family="-apple-system, sans-serif" font-size="9" fill="#94A3B8" text-anchor="middle">Operational Logs</text>

  <!-- Flow Arrows -->
  <line x1="180" y1="232" x2="220" y2="232" stroke="#5FA8C7" stroke-width="2" stroke-dasharray="4,4"/>
  <polygon points="220 228 228 232 220 236" fill="#5FA8C7"/>

  <!-- Bronze Layer -->
  <rect x="230" y="85" width="160" height="295" rx="8" fill="#1E293B" stroke="#9A3412" stroke-width="1.5"/>
  <rect x="230" y="85" width="160" height="35" rx="8" fill="url(#bronzeGrad)"/>
  <text x="310" y="108" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#FED7AA" text-anchor="middle">BRONZE LAYER</text>

  <rect x="242" y="135" width="136" height="60" rx="6" fill="#0F172A" stroke="#9A3412" stroke-width="1"/>
  <text x="310" y="160" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#F1F5F9" text-anchor="middle">Raw Ingestion</text>
  <text x="310" y="176" font-family="-apple-system, sans-serif" font-size="9" fill="#94A3B8" text-anchor="middle">1:1 Schema Replica</text>

  <rect x="242" y="210" width="136" height="145" rx="6" fill="#0F172A" stroke="#9A3412" stroke-width="1"/>
  <text x="310" y="235" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" fill="#FED7AA" text-anchor="middle">Layer Objectives:</text>
  <text x="252" y="260" font-family="-apple-system, sans-serif" font-size="9" fill="#E2E8F0">• Preserves Source Data</text>
  <text x="252" y="280" font-family="-apple-system, sans-serif" font-size="9" fill="#E2E8F0">• No Transformations</text>
  <text x="252" y="300" font-family="-apple-system, sans-serif" font-size="9" fill="#E2E8F0">• Historical Audit Trail</text>
  <text x="252" y="320" font-family="-apple-system, sans-serif" font-size="9" fill="#E2E8F0">• Fast Staging Loads</text>

  <!-- Flow Arrows -->
  <line x1="390" y1="232" x2="420" y2="232" stroke="#5FA8C7" stroke-width="2" stroke-dasharray="4,4"/>
  <polygon points="420 228 428 232 420 236" fill="#5FA8C7"/>

  <!-- Silver Layer -->
  <rect x="430" y="85" width="160" height="295" rx="8" fill="#1E293B" stroke="#64748B" stroke-width="1.5"/>
  <rect x="430" y="85" width="160" height="35" rx="8" fill="url(#silverGrad)"/>
  <text x="510" y="108" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#E2E8F0" text-anchor="middle">SILVER LAYER</text>

  <rect x="442" y="135" width="136" height="60" rx="6" fill="#0F172A" stroke="#64748B" stroke-width="1"/>
  <text x="510" y="160" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#F1F5F9" text-anchor="middle">Cleansed &amp; Enriched</text>
  <text x="510" y="176" font-family="-apple-system, sans-serif" font-size="9" fill="#94A3B8" text-anchor="middle">Stored Procedures ETL</text>

  <rect x="442" y="210" width="136" height="145" rx="6" fill="#0F172A" stroke="#64748B" stroke-width="1"/>
  <text x="510" y="235" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" fill="#E2E8F0" text-anchor="middle">Layer Objectives:</text>
  <text x="452" y="260" font-family="-apple-system, sans-serif" font-size="9" fill="#E2E8F0">• Data Deduplication</text>
  <text x="452" y="280" font-family="-apple-system, sans-serif" font-size="9" fill="#E2E8F0">• Type Standardization</text>
  <text x="452" y="300" font-family="-apple-system, sans-serif" font-size="9" fill="#E2E8F0">• Data Quality Filters</text>
  <text x="452" y="320" font-family="-apple-system, sans-serif" font-size="9" fill="#E2E8F0">• Relational Integrity</text>

  <!-- Flow Arrows -->
  <line x1="590" y1="232" x2="620" y2="232" stroke="#5FA8C7" stroke-width="2" stroke-dasharray="4,4"/>
  <polygon points="620 228 628 232 620 236" fill="#5FA8C7"/>

  <!-- Gold Layer -->
  <rect x="630" y="85" width="135" height="295" rx="8" fill="#1E293B" stroke="#D97706" stroke-width="1.5"/>
  <rect x="630" y="85" width="135" height="35" rx="8" fill="url(#goldGrad)"/>
  <text x="697" y="108" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#FEF3C7" text-anchor="middle">GOLD LAYER</text>

  <rect x="640" y="135" width="115" height="60" rx="6" fill="#0F172A" stroke="#D97706" stroke-width="1"/>
  <text x="697" y="160" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#F1F5F9" text-anchor="middle">Star Schema</text>
  <text x="697" y="176" font-family="-apple-system, sans-serif" font-size="9" fill="#94A3B8" text-anchor="middle">Facts &amp; Dimensions</text>

  <rect x="640" y="210" width="115" height="145" rx="6" fill="#0F172A" stroke="#D97706" stroke-width="1"/>
  <text x="697" y="235" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" fill="#FEF3C7" text-anchor="middle">Analytics:</text>
  <text x="648" y="260" font-family="-apple-system, sans-serif" font-size="9" fill="#E2E8F0">• Fact_Sales</text>
  <text x="648" y="280" font-family="-apple-system, sans-serif" font-size="9" fill="#E2E8F0">• Dim_Customer</text>
  <text x="648" y="300" font-family="-apple-system, sans-serif" font-size="9" fill="#E2E8F0">• Dim_Product</text>
  <text x="648" y="320" font-family="-apple-system, sans-serif" font-size="9" fill="#E2E8F0">• Dim_Date</text>

  <!-- Footer Notice -->
  <rect x="200" y="395" width="400" height="24" rx="4" fill="#3B82A6" fill-opacity="0.2"/>
  <text x="400" y="411" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" fill="#5FA8C7" text-anchor="middle">Screenshot Slot 1: Replace with your Architecture Diagram Image</text>
</svg>
